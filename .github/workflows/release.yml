name: Publish launcher

# Push a tag like v1.2.0 to publish a release with the launcher files players download:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix line endings
        run: |
          sed -i 's/\r*$/\r/' launcher/StoryForge.bat
          sed -i 's/\r$//' launcher/storyforge.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" launcher/StoryForge.bat launcher/storyforge.sh \
            --title "Story Forge $GITHUB_REF_NAME" --generate-notes \
            --notes "Download **StoryForge.bat** (Windows) or **storyforge.sh** (macOS / Linux). You also need Docker Desktop. See the README for details."
