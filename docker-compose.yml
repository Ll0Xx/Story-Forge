name: storyforge

services:
  storyforge:
    image: ghcr.io/ll0xx/story-forge:latest # prebuilt by GitHub Actions; `docker compose build` builds it locally
    # The launchers (launcher/) embed a copy of this file without `build`; keep them in sync.
    build: .
    ports:
      - "127.0.0.1:8000:8000"            # this computer only: the app has no password and holds your AI logins
    env_file:                            # optional: models, or tokens instead of the in-app login
      - path: .env
        required: false
    volumes:
      - worlds:/app/worlds               # your worlds (export/import them as .zip from the web UI)
      - claude-home:/home/player/.claude # Claude login + conversation history
      - codex-home:/home/player/.codex   # ChatGPT (Codex) login + conversation history
    restart: unless-stopped

volumes:
  worlds:
  claude-home:
  codex-home:
